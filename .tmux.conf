# Source this file
unbind r
bind r source-file ~/.tmux.conf

# Prefix
set-option -g prefix C-a

# Enable focus events
set-option -g focus-events on

# Set status positon on top
set-option -g status-position bottom

# To make tmux more pleasant
set -g mouse on
# set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",xterm-termite:Tc"
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"

# Navigate panes like you're in vim
setw -g mode-keys vi
bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# kanagawa theme configuations
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-show-powerline true
set -g @kanagawa-show-left-sep 
set -g @kanagawa-transparent-powerline-bg true
set -g @kanagawa-show-battery false
set -g @kanagawa-show-weather false
set -g @kanagawa-show-network false

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Nybkox/tmux-kanagawa'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
